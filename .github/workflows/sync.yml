name: Teamleader sync

# Runs the heavy Teamleader sync OUTSIDE Vercel (no 60s Hobby limit) and writes
# the snapshot + rotated token to Upstash, which the Vercel app reads. See
# docs/DEPLOYMENT.md "GitHub Actions sync route".
on:
  schedule:
    # UTC. Roughly spread across the NL business day. Adjust as needed.
    - cron: '0 5,9,13,17 * * *'
  workflow_dispatch: # manual run + triggered by the dashboard "Vernieuwen" button

# Never run two syncs at once — concurrent token refreshes would invalidate each other.
concurrency:
  group: teamleader-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Teamleader sync
        run: npm run sync
        env:
          TEAMLEADER_CLIENT_ID: ${{ secrets.TEAMLEADER_CLIENT_ID }}
          TEAMLEADER_CLIENT_SECRET: ${{ secrets.TEAMLEADER_CLIENT_SECRET }}
          # Seed only — used on the very first run when Upstash has no token yet.
          TEAMLEADER_REFRESH_TOKEN: ${{ secrets.TEAMLEADER_REFRESH_TOKEN }}
          TEAMLEADER_WRITEBACK: ${{ secrets.TEAMLEADER_WRITEBACK }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
